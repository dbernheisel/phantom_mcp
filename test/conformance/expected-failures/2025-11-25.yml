# Scenarios the 2025-11-25 requirement set scores that Phantom is known to
# fail, on every topology. The run fails when a scenario outside this list
# fails, or when a listed one passes; remove the entry once it is fixed.
server:
  # Server-initiated sampling is not implemented.
  - tools-call-sampling
  # `Phantom.Elicit` drops `default` on enum properties.
  - elicitation-sep1034-defaults:elicitation-sep1034-enum-default
  # Titled multi-select enums are sent as `items.oneOf` instead of
  # `items.anyOf`, so the client rejects the request and the call times out.
  - elicitation-sep1330-enums
  # Times out: the client reads the `initialize` response to the end, but
  # Phantom keeps that SSE stream open as the session stream.
  - dns-rebinding-protection
