# Failures that only occur when consecutive requests of a session are served
# by different nodes. Added to `2025-11-25.yml` for the distributed topology.
server:
  # `logging/setLevel` finds the session process with `Phantom.Tracker`, which
  # replicates across nodes eventually (every 1s by default). Right after
  # `initialize` on another node the lookup misses, the level is stored on the
  # short-lived POST process instead, and the tool's logs are filtered out.
  - tools-call-with-logging
  # Same cause: `resources/subscribe` and `resources/unsubscribe` look up the
  # session's stream with `Phantom.Tracker` and answer "SSE stream not open"
  # when the other node has not learned about it yet.
  - resources-subscribe
  - resources-unsubscribe
